<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beamer Progress Draft</title>
<style>
:root{--navy:#0b3d91;--blue:#1453c4;--ink:#1d2433;--muted:#667085;--paper:#f3f5f8;--line:#d8dee8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
header{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}header h1{font-size:16px;color:var(--navy);margin:0 16px 0 0}button,select,.file-button{border:1px solid #b8c1cf;border-radius:6px;background:#fff;padding:6px 10px;cursor:pointer;font:inherit}.add{background:#eef3ff;border-color:#bfd0f7}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.spacer{flex:1}
.main{height:calc(100vh - 54px);display:flex}.side{width:220px;min-width:220px;background:#fff;border-right:1px solid var(--line);padding:10px;overflow:auto}.slideitem{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px;margin-bottom:7px;background:#fafbfc;cursor:pointer}.slideitem.active{border-color:var(--navy);background:#edf3ff}.num{width:18px;color:var(--muted);font-size:12px}.label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.tiny{padding:2px 5px;font-size:11px}
.stagewrap{flex:1;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start}.viewport{transform-origin:top center}.slide{width:1024px;height:576px;background:#fff;box-shadow:0 5px 24px #1d243322;position:relative;overflow:hidden}.topbar{height:14px;background:linear-gradient(90deg,var(--navy),var(--blue))}.framehead{height:72px;background:var(--navy);color:#fff;padding:19px 32px;font-size:27px;font-weight:650}.body{position:absolute;left:0;right:0;top:86px;bottom:0;padding:30px 44px}.title-main{position:absolute;left:35px;right:35px;top:160px;text-align:center}.title-main .t{font-size:43px;font-weight:750;color:var(--navy)}.title-main .s{font-size:23px;color:var(--muted);margin-top:16px}.beamer{list-style:none;padding:0;margin:0}.beamer li{position:relative;padding-left:28px;margin:17px 0;font-size:25px;line-height:1.25}.beamer li:before{content:"▸";position:absolute;left:0;color:var(--navy);font-weight:700}.editable:focus{outline:2px solid #ffd34d;border-radius:3px}.warning{position:fixed;left:220px;right:0;bottom:0;background:#fff6d8;border-top:1px solid #e4c45b;color:#765d00;padding:7px 14px;min-height:30px}.hidden{display:none}.file-button input{display:none}
.image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}.image-card{border:1px solid var(--line);border-radius:8px;background:#fbfcfe;overflow:hidden;box-shadow:0 2px 8px #1d243310}.image-card img{display:block;width:100%;height:220px;object-fit:cover;background:#eef3ff}.image-card .caption{padding:10px 12px;font-size:18px;font-weight:650;color:var(--navy);text-align:center}.figure-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}.figure-wrap img{display:block;max-width:92%;max-height:390px;object-fit:contain}.figure-caption{font-size:17px;line-height:1.25;color:var(--muted);text-align:center;max-width:88%}.article-claim{font-size:29px;line-height:1.2;font-weight:700;color:var(--navy);margin:4px 0 24px}.article-takeaway{border-left:6px solid var(--navy);padding:12px 18px;margin-top:20px;font-size:23px;line-height:1.25;background:#eef3ff}.article-equation{text-align:center;font:32px Georgia,serif;padding:22px 0;color:#15284d}.article-theorem{border:2px solid var(--navy);padding:18px 24px;font-size:25px;line-height:1.3}.article-intuition{margin-top:20px;font-size:22px;line-height:1.3}.notes-panel{width:250px;min-width:250px;background:#fff;border-left:1px solid var(--line);padding:12px;overflow:auto}.notes-panel h2{font-size:13px;color:var(--navy);margin:0 0 8px}.notes-panel textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:6px;padding:8px;font:13px system-ui;resize:vertical}.notes-panel .quality{font-size:12px;color:var(--muted);line-height:1.35;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Beamer Progress Draft</h1>
  <button class="add" id="addTitle">+ Title slide</button>
  <button class="add" id="addItem">+ Bullet slide</button>
  <button id="deleteSlide">Delete</button>
  <button id="moveUp">Move up</button>
  <button id="moveDown">Move down</button>
  <select id="theme" aria-label="Beamer template"><option value="clean">Clean (Madrid)</option><option value="metropolis">Metropolis</option><option value="rochester">Rochester</option></select>
  <span class="spacer"></span>
  <button class="primary" id="exportJson">Export JSON</button>
  <label class="file-button">Import JSON<input id="importJson" type="file" accept="application/json"></label>
</header>
<div class="main"><aside class="side" id="side"></aside><main class="stagewrap" id="stagewrap"><div class="viewport" id="viewport"><section class="slide" id="slide"></section></div></main><aside class="notes-panel"><h2>Speaker notes</h2><textarea id="notesEditor" placeholder="Add presenter notes here..."></textarea><div class="quality" id="quality"></div></aside></div>
<div class="warning" id="warning">Edit the slide directly. Export JSON when the draft is ready.</div>
<script>
(() => {
  const librarySlides = [
    {type:"title",title:"Beamer Skills Library",subtitle:"From research notes to presentation-ready slides"},
    {type:"itemize",frametitle:"Slide production follows a staged workflow",items:["Draft project progress as editable slides","Convert structured content into Beamer source","Apply academic presentation rules before delivery"]},
    {type:"itemize",frametitle:"Three skills cover the authoring workflow",items:["beamer-format: content and layout standards","beamer-live-draft: interactive HTML drafting and transpilation","verify-tikz-layout: rendered evidence and visual inspection"]},
    {type:"itemize",frametitle:"Progress drafts stay simple and convertible",items:["One HTML slide maps to one future Beamer frame","Title slides and title-plus-bullets slides are supported","JSON provides a stable handoff between editing and generation"]},
    {type:"itemize",frametitle:"The generator preserves content and flags risks",items:["Escapes LaTeX special characters automatically","Warns about empty titles and more than five bullets","Supports clean, metropolis, and rochester templates"]},
    {type:"itemize",frametitle:"Academic rules keep the deck audience-friendly",items:["One point per slide with conclusion-driven titles","Readable fonts, balanced whitespace, and minimal tables","Main results first; full details move to the appendix"]},
    {type:"itemize",frametitle:"TikZ verification is a separate visual gate",items:["Compile and render the relevant pages or overlays","Inspect every required image for overlap and clipping","Repair layout without changing analytical meaning"]},
    {type:"itemize",frametitle:"Notes become a reproducible PDF workflow",items:["Edit progress-draft.html and export progress.json","Run generate.py to produce slides.tex and optionally slides.pdf","Review the final deck with the publication and visual checks"]},
    {type:"image_grid",frametitle:"Image layout remains readable beside slide text",images:[
      {label:"HTML draft",src:"data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 400'%3E%3Crect width='640' height='400' fill='%23eef3ff'/%3E%3Crect x='36' y='34' width='568' height='62' rx='10' fill='%230b3d91'/%3E%3Crect x='72' y='142' width='496' height='28' rx='14' fill='%239ab5ee'/%3E%3Crect x='72' y='202' width='430' height='28' rx='14' fill='%23c3d4f5'/%3E%3Crect x='72' y='262' width='360' height='28' rx='14' fill='%23d9e4fa'/%3E%3Ctext x='320' y='365' text-anchor='middle' font-family='Arial' font-size='28' fill='%230b3d91'%3EEditable draft%3C/text%3E%3C/svg%3E"},
      {label:"JSON contract",src:"data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 400'%3E%3Crect width='640' height='400' fill='%23f4f8f4'/%3E%3Crect x='54' y='44' width='532' height='312' rx='12' fill='%232d6a4f'/%3E%3Ctext x='94' y='112' font-family='monospace' font-size='27' fill='white'%3E%7B%22slides%22:%20%5B%3C/text%3E%3Ctext x='94' y='166' font-family='monospace' font-size='27' fill='%23b7e4c7'%3E%7B%22type%22:%20%22itemize%22%7D%3C/text%3E%3Ctext x='94' y='220' font-family='monospace' font-size='27' fill='%23b7e4c7'%3E%7B%22items%22:%20%5B...%5D%7D%3C/text%3E%3Ctext x='94' y='274' font-family='monospace' font-size='27' fill='white'%3E%5D%7D%3C/text%3E%3Ctext x='320' y='365' text-anchor='middle' font-family='Arial' font-size='28' fill='%232d6a4f'%3EStructured handoff%3C/text%3E%3C/svg%3E"},
      {label:"Beamer output",src:"data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 400'%3E%3Crect width='640' height='400' fill='%23fff8e7'/%3E%3Crect x='48' y='42' width='544' height='254' rx='12' fill='white' stroke='%23d79b00' stroke-width='8'/%3E%3Crect x='48' y='42' width='544' height='64' rx='12' fill='%23d79b00'/%3E%3Ccircle cx='104' cy='74' r='13' fill='white'/%3E%3Crect x='86' y='150' width='360' height='22' rx='11' fill='%23e7c56a'/%3E%3Crect x='86' y='198' width='430' height='22' rx='11' fill='%23f1dfaa'/%3E%3Ctext x='320' y='365' text-anchor='middle' font-family='Arial' font-size='28' fill='%23a56d00'%3EFinal presentation%3C/text%3E%3C/svg%3E"}
    ]}
  ];
  const articleSlides = [
    {type:"title",title:"The AI Lemons Problem",subtitle:"How AI adoption can unravel prediction markets — Guojun He (March 2026)"},
    {type:"itemize",frametitle:"AI can improve prediction while undermining market viability",items:["AI raises the predictive advantage of a subset of traders","Market makers respond with wider bid–ask spreads","Uninformed and liquidity-motivated traders then exit","Beyond a threshold, no active equilibrium survives"]},
    {type:"itemize",frametitle:"The paper shifts attention from price accuracy to participation",items:["Prediction markets need counterparties, not information alone","Uninformed traders provide the order flow that sustains trade","Their participation is endogenous to the spread they face","The key object is market composition, not only price informativeness"]},
    {type:"figure",frametitle:"AI adoption raises spreads, which drives out uninformed traders",caption:"Figure 1. The adverse-selection spiral in the paper's baseline model.",src:"data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 430'%3E%3Cdefs%3Emarker id='a' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'%3E%3Cpath d='M0,0 L10,3 L0,6 z' fill='%230b3d91'/%3E%3C/marker%3E%3C/defs%3E%3Crect width='980' height='430' fill='white'/%3E%3Cg fill='white' stroke='%231d2433' stroke-width='2'%3E%3Crect x='70' y='55' width='250' height='78' rx='12'/%3E%3Crect x='660' y='55' width='250' height='78' rx='12'/%3E%3Crect x='660' y='290' width='250' height='78' rx='12'/%3E%3Crect x='70' y='290' width='250' height='78' rx='12'/%3E%3C/g%3E%3Cg font-family='Arial' font-size='25' text-anchor='middle' fill='%231d2433'%3E%3Ctext x='195' y='88'%3EHigher AI penetration%3C/text%3E%3Ctext x='195' y='118'%3Eα ↑%3C/text%3E%3Ctext x='785' y='88'%3EWider spread%3C/text%3E%3Ctext x='785' y='118'%3Es ↑%3C/text%3E%3Ctext x='785' y='323'%3EUninformed exit%3C/text%3E%3Ctext x='785' y='353'%3Et(s) = 1 − F(s) ↓%3C/text%3E%3Ctext x='195' y='323'%3EHigher informed share%3C/text%3E%3Ctext x='195' y='353'%3Econditional on trade%3C/text%3E%3C/g%3E%3Cg fill='none' stroke='%230b3d91' stroke-width='3' marker-end='url(%23a)'%3E%3Cpath d='M320 94 L660 94'/%3E%3Cpath d='M785 133 L785 290'/%3E%3Cpath d='M660 329 L320 329'/%3E%3Cpath d='M195 290 C390 235 535 190 700 145'/%3E%3C/g%3E%3C/svg%3E"},
    {type:"itemize",frametitle:"The model isolates three ingredients behind collapse",items:["Binary prediction contract with informed and uninformed traders","Uninformed traders have heterogeneous non-informational values z","Competitive market makers price orders conditional on direction","AI adoption α determines the share of highly informed order flow"]},
    {type:"itemize",frametitle:"More informed order flow makes every order more revealing",items:["AI-informed traders buy when V = 1 and sell when V = 0","Uninformed traders trade only when their value exceeds the spread","The gap in buy probabilities across states equals α","Market makers therefore widen spreads as α rises"]},
    {type:"itemize",frametitle:"Pricing and participation form a fixed-point problem",items:["Half-spread: s = α / {2[α + (1 − α)t]}","Participation: t = 1 − F(s)","A higher spread reduces t and makes order flow more informed","This feedback creates strategic complementarity in adverse selection"]},
    {type:"itemize",frametitle:"The minimum adverse-selection cost rises with AI adoption",items:["Any active equilibrium must satisfy s ≥ α/2","The strongest uninformed participation motive is z̄","If α/2 exceeds z̄, no uninformed trader can remain active","The collapsed outcome has t = 0, A = 1, and B = 0"]},
    {type:"itemize",frametitle:"Market collapse occurs when AI penetration exceeds the threshold",items:["Theorem 1: if α > 2z̄, no active equilibrium exists","The collapsed equilibrium is then unique","The threshold compares AI-induced spread pressure with participation value","AI does not need to be perfectly omniscient for the logic to apply"]},
    {type:"figure",frametitle:"Higher AI penetration shifts the spread schedule toward collapse",caption:"Figure 2. Schematic fixed-point representation from the paper.",src:"data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 520'%3E%3Crect width='980' height='520' fill='white'/%3E%3Cg stroke='%231d2433' stroke-width='3' fill='none'%3E%3Cpath d='M150 420 L150 80 M150 420 L850 420'/%3E%3Cpath d='M170 400 L760 100' stroke='%231d2433'/%3E%3Cpath d='M180 350 C330 290 450 230 650 190' stroke='%231453c4' stroke-width='5'/%3E%3Cpath d='M180 300 C350 230 500 160 690 80' stroke='%23d94c4c' stroke-width='5' stroke-dasharray='12 8'/%3E%3Cpath d='M440 250 L440 250' stroke='%231453c4'/%3E%3Ccircle cx='450' cy='255' r='8' fill='%231453c4'/%3E%3C/g%3E%3Cg font-family='Arial' fill='%231d2433' font-size='25'%3E%3Ctext x='42' y='90'%3EImplied half-spread%3C/text%3E%3Ctext x='730' y='465'%3EHalf-spread s%3C/text%3E%3Ctext x='710' y='110' fill='%231d2433'%3E45° line%3C/text%3E%3Ctext x='650' y='175' fill='%231453c4'%3EΦ(s; αL)%3C/text%3E%3Ctext x='690' y='68' fill='%23d94c4c'%3EΦ(s; αH)%3C/text%3E%3Ctext x='340' y='275' fill='%23667085'%3Eupward shift as α rises%3C/text%3E%3Ctext x='455' y='292' fill='%231d2433'%3Eactive fixed point%3C/text%3E%3C/g%3E%3C/svg%3E"},
    {type:"itemize",frametitle:"AI rents are transfers, while participation creates baseline surplus",items:["AI-informed traders earn positive rents in active equilibrium","Market makers earn zero expected profit by construction","Uninformed traders generate value through hedging, expression, and participation","AI profits equal the spread losses imposed on uninformed traders"]},
    {type:"itemize",frametitle:"Participation-based welfare declines with AI penetration",items:["Baseline welfare integrates the values of uninformed traders who remain active","Higher α raises the equilibrium spread and lowers participation","The participation surplus therefore weakly decreases with α","Price informativeness could add value only under an augmented welfare criterion"]},
    {type:"itemize",frametitle:"Private AI adoption can be excessive because it ignores the participation externality",items:["Each adopter captures informational rents or avoids exploitation","Each adopter also worsens spreads for other market participants","Under the baseline welfare criterion, the planner prefers the lowest feasible adoption","Positive private adoption can therefore exceed the social optimum"]},
    {type:"itemize",frametitle:"Market design can target the participation margin rather than price accuracy",items:["Participation subsidies lower the effective cost of trading","AI adoption taxes reduce the privately chosen adoption share","Public information can reduce the AI informational edge","The same logic applies to automated market makers through liquidity withdrawal"]},
    {type:"itemize",frametitle:"The collapse mechanism survives several extensions",items:["Imperfect AI replaces α with an effective informational intensity","Heterogeneous AI quality preserves the adverse-selection feedback","Dynamic persistence creates path dependence and hysteresis","AMM, multi-market, and heterogeneous-skill settings retain the core force"]},
    {type:"itemize",frametitle:"The paper offers testable predictions, not evidence that collapse has occurred",items:["Higher AI exposure should predict wider spreads","Wider spreads should reduce participation by less informed users","Order flow should become more concentrated in informed traders","Experiments and observational designs can test proximity to the threshold"]},
    {type:"itemize",frametitle:"The headline is a trade-off between local efficiency and institutional survival",items:["AI can improve conditional prediction and price discovery","The same advantage can eliminate the participation base of the market","The relevant policy margin is market composition, not accuracy alone","Whether current markets are near the threshold remains an open empirical question"]},
    {type:"itemize",frametitle:"Appendix: the full paper develops the mechanism beyond the baseline model",items:["Closed-form benchmark and equilibrium selection","Welfare decomposition, adoption, and policy instruments","Imperfect AI, heterogeneous quality, and dynamic persistence","AMMs, multi-market substitution, and heterogeneous predictive ability"]}
  ];
  articleSlides[3].src = "ai-adverse-selection-spiral.png";
  articleSlides[1] = {type:"claim",frametitle:"AI can improve prediction while undermining market viability",claim:"Higher AI penetration widens spreads and drives out uninformed traders.",evidence:["The informed share of order flow rises with AI adoption","Uninformed participation is endogenous to the spread"],takeaway:"The market can collapse even as conditional prediction improves.",speakerNotes:"Start with the paper's headline finding and distinguish market viability from price accuracy."};
  articleSlides[6] = {type:"equation",frametitle:"Pricing and participation form a fixed-point problem",equation:"s = α / [2(α + (1 − α)(1 − F(s)))]",definitions:["s: equilibrium half-spread","α: AI penetration","F(s): share of uninformed traders priced out"],meaning:"A wider spread reduces participation and makes order flow more informative.",speakerNotes:"This is the central feedback equation of the baseline model."};
  articleSlides[8] = {type:"theorem",frametitle:"AI penetration above the threshold eliminates active equilibrium",statement:"If α > 2 z̄, no active equilibrium exists and the collapsed equilibrium is unique.",intuition:"The minimum AI-induced spread exceeds the strongest non-informational participation value.",speakerNotes:"State the theorem formally, then clarify that empirical proximity to the threshold remains open."};
  articleSlides[16] = {type:"takeaway",frametitle:"The headline is a trade-off between local efficiency and institutional survival",takeaway:"AI may improve price discovery while destroying the participation base that makes price discovery possible.",speakerNotes:"Use this as the final main-text conclusion before the appendix."};
  const articleTypes = ["claim", "figure", "equation", "theorem", "takeaway"];
  const starterSlides = [{type:"title",title:"Project progress",subtitle:"Research notes"},{type:"itemize",frametitle:"The next step is clear",items:["Record what has been completed","Write the current research question","List the next concrete action"]}];
  const params = new URLSearchParams(location.search);
  const state = {version:1, template:"clean", slides:params.has("article") ? articleSlides : params.has("library") ? librarySlides : starterSlides};
  let selected = 0;
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  function renderNav(){
    $("side").innerHTML = state.slides.map((s,i) => `<div class="slideitem ${i===selected?"active":""}" data-index="${i}"><span class="num">${i+1}</span><span class="label">${esc(s.type === "title" ? s.title || "Title slide" : s.frametitle || "Bullet slide")}</span></div>`).join("");
    document.querySelectorAll(".slideitem").forEach(el => el.onclick = () => {selected=Number(el.dataset.index);render();});
  }
  function render(){
    const s = state.slides[selected];
    $("theme").value = state.template;
    if(!s){$("slide").innerHTML="";renderNav();return;}
    if(s.type === "title") $("slide").innerHTML = `<div class="topbar"></div><div class="title-main"><div class="t editable" contenteditable="true" data-field="title">${esc(s.title)}</div><div class="s editable" contenteditable="true" data-field="subtitle">${esc(s.subtitle)}</div></div>`;
    else if(s.type === "claim") $("slide").innerHTML = `<div class="topbar"></div><div class="framehead editable" contenteditable="true" data-field="frametitle">${esc(s.frametitle)}</div><div class="body"><div class="article-claim editable" contenteditable="true" data-field="claim">${esc(s.claim)}</div><ul class="beamer">${(s.evidence||[]).map((item,i)=>`<li><span class="editable" contenteditable="true" data-evidence="${i}">${esc(item)}</span></li>`).join("")}</ul>${s.takeaway?`<div class="article-takeaway editable" contenteditable="true" data-field="takeaway">${esc(s.takeaway)}</div>`:""}</div>`;
    else if(s.type === "equation") $("slide").innerHTML = `<div class="topbar"></div><div class="framehead editable" contenteditable="true" data-field="frametitle">${esc(s.frametitle)}</div><div class="body"><div class="article-equation editable" contenteditable="true" data-field="equation">${esc(s.equation)}</div><ul class="beamer">${(s.definitions||[]).map((item,i)=>`<li><span class="editable" contenteditable="true" data-definition="${i}">${esc(item)}</span></li>`).join("")}</ul><div class="article-takeaway editable" contenteditable="true" data-field="meaning">${esc(s.meaning||"")}</div></div>`;
    else if(s.type === "theorem") $("slide").innerHTML = `<div class="topbar"></div><div class="framehead editable" contenteditable="true" data-field="frametitle">${esc(s.frametitle)}</div><div class="body"><div class="article-theorem editable" contenteditable="true" data-field="statement">${esc(s.statement)}</div><div class="article-intuition"><strong>Intuition:</strong> <span class="editable" contenteditable="true" data-field="intuition">${esc(s.intuition)}</span></div></div>`;
    else if(s.type === "takeaway") $("slide").innerHTML = `<div class="topbar"></div><div class="framehead editable" contenteditable="true" data-field="frametitle">${esc(s.frametitle)}</div><div class="body"><div class="article-takeaway editable" contenteditable="true" data-field="takeaway">${esc(s.takeaway)}</div></div>`;
    else if(s.type === "image_grid") $("slide").innerHTML = `<div class="topbar"></div><div class="framehead editable" contenteditable="true" data-field="frametitle">${esc(s.frametitle)}</div><div class="body"><div class="image-grid">${s.images.map(image => `<div class="image-card"><img src="${image.src}" alt="${esc(image.label)}"><div class="caption">${esc(image.label)}</div></div>`).join("")}</div></div>`;
    else if(s.type === "figure") $("slide").innerHTML = `<div class="topbar"></div><div class="framehead editable" contenteditable="true" data-field="frametitle">${esc(s.frametitle)}</div><div class="body"><div class="figure-wrap"><img src="${s.src}" alt="${esc(s.caption)}"><div class="figure-caption editable" contenteditable="true" data-field="caption">${esc(s.caption)}</div></div></div>`;
    else $("slide").innerHTML = `<div class="topbar"></div><div class="framehead editable" contenteditable="true" data-field="frametitle">${esc(s.frametitle)}</div><div class="body"><ul class="beamer">${(s.items||[]).map((item,i)=>`<li><span class="editable" contenteditable="true" data-item="${i}">${esc(item)}</span> <button class="tiny" data-remove="${i}" title="Remove bullet">×</button></li>`).join("")}</ul><button class="add" id="addBullet">+ Bullet</button></div>`;
    document.querySelectorAll("[contenteditable]").forEach(el => el.oninput = () => {const current=state.slides[selected];if(el.dataset.item !== undefined) current.items[Number(el.dataset.item)] = el.innerText;else if(el.dataset.evidence !== undefined) current.evidence[Number(el.dataset.evidence)] = el.innerText;else if(el.dataset.definition !== undefined) current.definitions[Number(el.dataset.definition)] = el.innerText;else current[el.dataset.field] = el.innerText;renderNav();updateWarning();renderNotes();});
    document.querySelectorAll("[data-remove]").forEach(el => el.onclick = () => {s.items.splice(Number(el.dataset.remove),1);render();});
    const addBullet = $("addBullet"); if(addBullet) addBullet.onclick = () => {s.items.push("New point");render();};
    renderNav();updateWarning();renderNotes();fit();
  }
  function articleQuality(){if(!state.slides.some(s=>s.type === "claim")) return ["Article deck needs a claim slide."];if(!state.slides.some(s=>["figure","equation"].includes(s.type))) return ["Article deck needs a figure or equation."];if(!state.slides.some(s=>["theorem","takeaway"].includes(s.type))) return ["Article deck needs a formal result or takeaway."];if(state.slides.filter(s=>s.type === "itemize").length > state.slides.length / 2) return ["Many slides are bullet-only; consider replacing some with claims, figures, equations, or takeaways."];return ["Article structure looks healthy."];}
  function updateWarning(){const s=state.slides[selected];const messages=[];if(s.type === "itemize" && !s.frametitle.trim()) messages.push("This slide has an empty title.");if(s.type === "itemize" && s.items.length>5) messages.push("This slide has more than five bullets.");if(new URLSearchParams(location.search).has("article")) messages.push(...articleQuality());$("warning").textContent=messages.length?messages.join(" "):"Edit the slide directly. Export JSON when the draft is ready.";}
  function renderNotes(){const s=state.slides[selected]||{};const editor=$("notesEditor");if(document.activeElement!==editor) editor.value=s.speakerNotes||"";$("quality").textContent=new URLSearchParams(location.search).has("article")?articleQuality().join(" "):"Notes mode: add context for future slides.";}
  function add(type){state.slides.push(type === "title" ? {type,title:"New project",subtitle:""} : {type:"itemize",frametitle:"New progress point",items:["New point"]});selected=state.slides.length-1;render();}
  $("addTitle").onclick=()=>add("title");$("addItem").onclick=()=>add("itemize");
  $("deleteSlide").onclick=()=>{if(state.slides.length>1){state.slides.splice(selected,1);selected=Math.max(0,selected-1);render();}};
  function move(delta){const next=selected+delta;if(next<0||next>=state.slides.length)return;[state.slides[selected],state.slides[next]]=[state.slides[next],state.slides[selected]];selected=next;render();}
  $("moveUp").onclick=()=>move(-1);$("moveDown").onclick=()=>move(1);$("theme").onchange=e=>state.template=e.target.value;
  $("notesEditor").oninput=e=>{state.slides[selected].speakerNotes=e.target.value;};
  $("exportJson").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="progress.json";a.click();URL.revokeObjectURL(a.href);};
  $("importJson").onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const incoming=JSON.parse(reader.result);if(!Array.isArray(incoming.slides))throw new Error("JSON must contain slides");state.version=incoming.version||1;state.template=incoming.template||"clean";state.slides=incoming.slides;selected=0;render();};reader.readAsText(file);};
  function fit(){const scale=Math.min(1,(window.innerWidth-260)/1024,(window.innerHeight-90)/576);$("viewport").style.transform=`scale(${Math.max(.35,scale)})`;$("stagewrap").style.paddingBottom=`${576*Math.max(.35,scale)+30}px`;}
  window.onresize=fit;render();
})();
</script>
</body>
